user www-data;
worker_processes auto;
error_log /dev/stderr warn;
pid /tmp/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    access_log /dev/stdout;
    sendfile on;
    tcp_nopush on;
    keepalive_timeout 65;
    client_max_body_size 20M;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml image/svg+xml;

    # Must match what docker/start.sh creates and chowns to www-data (the
    # worker user set at the top of this file) — otherwise every file
    # upload fails with a permission error before it ever reaches PHP.
    client_body_temp_path /var/lib/nginx/tmp/client_body;
    fastcgi_temp_path /var/lib/nginx/tmp/fastcgi;

    server {
        listen 8080 default_server;
        server_name _;

        root /var/www/html/public;
        index index.php index.html;

        charset utf-8;

        location / {
            try_files $uri $uri/ /index.php?$query_string;
        }

        location = /favicon.ico { access_log off; log_not_found off; }
        location = /robots.txt  { access_log off; log_not_found off; }

        error_page 404 /index.php;

        location ~ \.php$ {
            fastcgi_pass 127.0.0.1:9000;
            fastcgi_index index.php;
            include fastcgi_params;
            fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
            fastcgi_param HTTPS $http_x_forwarded_proto;
            fastcgi_read_timeout 120;
        }

        # Block dotfiles except .well-known (needed for ACME / domain verification)
        location ~ /\.(?!well-known).* {
            deny all;
        }
    }
}
