; The base php:8.4-fpm-alpine image defaults to upload_max_filesize=2M and
; post_max_size=8M, both below what this app's own validation rules already
; allow (5MB for registration documents and product files, see
; app/Livewire/Portal/Documents.php and Products.php) — so a file the app
; says is fine would still be silently truncated/rejected by PHP itself.
; Kept under nginx's client_max_body_size (20M, docker/nginx.conf).
upload_max_filesize = 10M
post_max_size = 12M
